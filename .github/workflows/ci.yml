name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: fieldsync, POSTGRES_PASSWORD: fieldsync_dev, POSTGRES_DB: fieldsync }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U fieldsync" --health-interval 5s --health-timeout 3s --health-retries 10
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r requirements.txt pip-audit
      - run: pytest -q # creates and migrates its own fieldsync_test database
      - run: pip-audit -r requirements.txt

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: admin-web/package-lock.json }
      - run: npm ci
      - run: npm run build # tsc --noEmit + vite build
      - run: npm test
      - run: npm audit --omit=dev

  mobile:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      # android/ and ios/ are generated (see docs/mobile-setup.md); analysis and tests do not need them.
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter analyze
      - run: flutter test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t fieldsync-backend .

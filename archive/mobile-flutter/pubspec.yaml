name: fieldsync_mobile
description: FieldSync agent app (offline-first field reports).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0" # RadioGroup / DropdownButtonFormField.initialValue need 3.32+/3.33+

# Caret ranges within each current major; the exact versions in use are fixed by pubspec.lock (commit it).
# drift + drift_dev + drift_flutter must move together; re-run build_runner after any bump.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  drift: ^2.22.1
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.1
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  workmanager: ^0.10.10
  crypto: ^3.0.6
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.5
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  image_picker_platform_interface: ^2.10.1
  sqlite3: ^2.9.4 # used by test/migration_test.dart (upgrade safety)
  flutter_lints: ^5.0.0
  drift_dev: ^2.22.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  assets:
    - assets/images/aham-logo.jpg
  # Inter (SIL Open Font License, see assets/fonts/OFL.txt), bundled so the app looks the same offline.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700


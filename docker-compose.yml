services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldsync_dev}
      POSTGRES_DB: ${POSTGRES_DB:-fieldsync}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldsync}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fieldsync}:${POSTGRES_PASSWORD:-fieldsync_dev}@db:5432/${POSTGRES_DB:-fieldsync}
      STORAGE_ROOT: /data/storage
      GEOCODER: ${GEOCODER:-nominatim}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-FieldSync/0.1 (dev)}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - storage:/data/storage

volumes:
  pgdata:
  storage:

# Production / staging stack: Caddy (HTTPS, admin web, API proxy) -> backend -> PostgreSQL.
# Only the proxy publishes ports. Required secrets have no defaults: the stack will not start without them.
#   cp .env.production.example .env.prod   # fill in, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Own project name => own volumes; never touches the development stack's database.
name: fieldsync-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-fieldsync}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fieldsync}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fieldsync}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-fieldsync}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (openssl rand -hex 32)}
      FILE_URL_SECRET: ${FILE_URL_SECRET:?set FILE_URL_SECRET (openssl rand -hex 32)}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      STORAGE_BACKEND: local
      STORAGE_ROOT: /data/storage
      GEOCODER: ${GEOCODER:-nominatim}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      CORS_ORIGINS: ${PUBLIC_ORIGIN:-}
      # The backend is reachable only from the proxy on the compose network, so trust its X-Forwarded-For:
      # the login rate limiter then sees real client IPs instead of the proxy's.
      FORWARDED_ALLOW_IPS: "*"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - storage:/data/storage
    expose:
      - "8000"

  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS (e.g. app.example.com)}
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  storage:
  caddy_data:
  caddy_config:
